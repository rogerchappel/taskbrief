workspace: rogerchappel-oss
repos:
  branchbrief:
    path: ~/Developer/my-opensource/branchbrief
    type: oss-cli
    default_base: main
    aliases:
      - branch brief
      - bb
    requires_pr: true
    common_verification:
      - npm test
      - npm run build
      - npm run typecheck
    forbidden_by_default:
      - .env*
      - secrets/**
    risk_defaults:
      docs: low
      tests: low
      ci: medium
      release: medium
      npm: medium
      auth: high
      payments: high
      production_data: high
  product-videogen:
    path: ~/Developer/work/product-videogen
    type: product
    default_base: main
    production_sensitive: true
    requires_pr: true
    common_verification:
      - npm test
      - npm run build
    forbidden_by_default:
      - billing/**
      - auth/**
      - production/**
      - .env*
