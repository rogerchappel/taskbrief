name: Docs

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-hygiene:
    name: Docs hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate docs directory
        run: |
          set -euo pipefail

          test -d docs
          test -s docs/PRD.md

      - name: Validate markdown paths
        run: |
          set -euo pipefail

          find . -type f -name '*.md' -not -path './.git/*' -print | sort > markdown-files.txt
          test -s markdown-files.txt

          while IFS= read -r file; do
            test -s "$file"
          done < markdown-files.txt

      - name: Validate packaged docs surface
        run: |
          set -euo pipefail

          test -f package.json
          grep -q '"docs"' package.json
          grep -q '"examples"' package.json
          grep -q 'docs/PRD.md' README.md
