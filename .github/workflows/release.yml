name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git "$RUNNER_TEMP/releasebox"
          npm ci --prefix "$RUNNER_TEMP/releasebox"
          npm run build --prefix "$RUNNER_TEMP/releasebox"
      - name: ReleaseBox readiness check
        run: node "$RUNNER_TEMP/releasebox/bin/releasebox.js" check .
      - run: npm run release:check
      - run: npm pack
      - name: Generate release notes
        run: |
          set -euo pipefail
          if node "$RUNNER_TEMP/releasebox/bin/releasebox.js" notes . > RELEASE_NOTES.md && [ -s RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md
          else
            echo "## Changes" > RELEASE_NOTES.md
            git log --oneline "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~20)..HEAD" >> RELEASE_NOTES.md
            cat RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: '*.tgz'
