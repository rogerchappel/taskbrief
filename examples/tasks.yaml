version: "0.1"
source: taskbrief
workspace: rogerchappel-oss
tasks:
  - id: branchbrief-npm-release-readiness
    title: Prepare branchbrief for npm release
    repo: branchbrief
    branch: agent/npm-release-readiness
    type: release
    risk: medium
    objective: Prepare branchbrief for its first npm release without publishing.
    context: Package metadata, bin path, release docs, changelog, and dry-run packaging need review before v0.1.0.
    allowed_paths:
      - package.json
      - README.md
      - docs/**
      - CHANGELOG.md
      - .github/workflows/publish.yml
    forbidden_paths:
      - src/**
      - .env*
      - secrets/**
    verification:
      - npm ci
      - npm test
      - npm run build
      - npm pack --dry-run
    stop_conditions:
      - npm token required
      - package name unavailable
      - publish requested
      - secrets or credentials required
    expected_commits:
      - "chore(package): prepare npm package metadata"
      - "docs(npm): document first release process"
      - "ci(release): add npm publish workflow"
    review_pack_required: true
    human_decision_needed:
      - approve package name
      - approve first publish
    agent_prompt: >
      Prepare branchbrief for release readiness only. Do not publish, request
      tokens, or touch source files unless a maintainer expands the task.
  - id: product-videogen-mobile-qa
    title: Run product-videogen mobile QA pass
    repo: product-videogen
    branch: agent/mobile-qa-demo-readiness
    type: qa
    risk: medium
    objective: Produce a mobile QA checklist and test report before the next demo.
    context: The product repo needs mobile testing, but auth, billing, production data, and secrets are out of scope.
    allowed_paths:
      - docs/**
      - test-results/**
      - qa/**
    forbidden_paths:
      - auth/**
      - billing/**
      - production/**
      - .env*
      - secrets/**
    verification:
      - npm test
      - npm run build
      - npm run test:mobile
    stop_conditions:
      - auth or billing code needs changes
      - production data required
      - secrets or credentials required
      - mobile test command is missing
    expected_commits:
      - "docs(qa): add mobile demo readiness report"
    review_pack_required: true
    human_decision_needed:
      - approve demo readiness assessment
    agent_prompt: >
      Run the mobile QA workflow and document findings. Do not modify auth,
      billing, production data, environment files, or secrets.
